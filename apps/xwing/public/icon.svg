<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0b0f1a"/>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="96" cy="110" r="5"/>
    <circle cx="420" cy="86" r="4"/>
    <circle cx="440" cy="330" r="5"/>
