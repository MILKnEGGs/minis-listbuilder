    <line x1="256" y1="256" x2="400" y2="150"/>
    <line x1="256" y1="256" x2="112" y2="362"/>
    <line x1="256" y1="256" x2="400" y2="362"/>
  </g>
  <circle cx="256" cy="256" r="46" fill="#1a2336" stroke="#ff8a3d" stroke-width="14"/>
  <g fill="#ffd2b0">
    <circle cx="112" cy="150" r="14"/>
    <circle cx="400" cy="150" r="14"/>
    <circle cx="112" cy="362" r="14"/>
    <circle cx="400" cy="362" r="14"/>
  </g>
